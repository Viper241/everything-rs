[workspace]
resolver = "3"
members = ["crates/ev-core", "crates/ev-ntfs", "crates/ev-cli", "crates/ev-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["everything-rs contributors"]

[workspace.dependencies]
ev-core = { path = "crates/ev-core" }
ev-ntfs = { path = "crates/ev-ntfs" }
memchr = "2.8"
windows-sys = "0.61"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3
